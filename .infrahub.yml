---
# Infrahub repository configuration for this repository, registered on main as the
# read-only repository `fylgja` (D-044).
# One Jinja2 transformation renders a device's production configuration from the schema
# library's DCIM (DcimDevice, its DcimPlatform and OrganizationManufacturer, its
# InterfacePhysical ports and their DcimCable), SR Linux or EOS by the device's platform;
# one artifact definition generates it for every device in the group `fylgja-devices`.
# The checks are clients of Fylgja's API, glue on Infrahub's runtime (contracts/checks.md):
# global, with no targets and no parameters, so Infrahub's task workers run each on every
# proposed change, draft or not, reaching the API at FYLGJA_API_ADDRESS with
# FYLGJA_API_TOKEN from their environment (the Compose override). fylgja-step asks for the
# stage plan; fylgja-twin skips a draft, and otherwise asks for the rehearsal and posts its
# report as one comment in a new thread on the proposed change, which its overview shows: its
# one write (D-049, D-053), the thread deleted only when its comment cannot be saved. Each
# binds the query fylgja_branch through its class's `query`, never a `query:` key under its
# definition.

queries:
  - name: device_config
    file_path: infrahub/queries/device_config.gql
  - name: fylgja_branch
    file_path: infrahub/queries/branch.gql

jinja2_transforms:
  - name: srlinux_device_config
    description: One device's configuration, SR Linux or EOS by its platform, from the schema library's DCIM.
    query: device_config
    template_path: infrahub/templates/device_config.j2
    watch:
      files: []

artifact_definitions:
  - name: srlinux_device_config
    artifact_name: device-config
    parameters:
      device: name__value
    content_type: text/plain
    targets: fylgja-devices
    transformation: srlinux_device_config

check_definitions:
  - name: fylgja-step
    file_path: infrahub/checks/fylgja_step.py
    class_name: FylgjaStep
  - name: fylgja-twin
    file_path: infrahub/checks/fylgja_twin.py
    class_name: FylgjaTwin
