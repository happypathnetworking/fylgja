[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "fylgja-core"
version = "0.0.0"
description = "Fylgja's core: a blueprint becomes a twin."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "grpcio==1.84.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "protobuf==7.36.2",
    "pygnmi==0.8.15",
    "PyYAML==6.0.3",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
]

[project.scripts]
fylgja-core = "fylgja_core.cli:main"
fylgja-core-server = "fylgja_core.server.__main__:main"

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pytest==9.2.0",
    "rfc8785==0.1.4",
    "ruff==0.17.3",
    "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fylgja_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: boots images on the local containerlab driver; run with make live"]
addopts = "-p no:cacheprovider -m 'not live'"
# Starlette 1.9.0's TestClient prefers httpx2; the project pins httpx (D-039) for the readiness wait and the push.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests", "../scripts"]

[[tool.mypy.overrides]]
module = ["jsonschema.*", "rfc8785.*", "referencing.*", "pygnmi.*", "grpc.*"]
ignore_missing_imports = true
