[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "fylgja-core"
version = "0.0.0"
description = "Fylgja's core: a blueprint becomes a twin."
license = "Apache-2.0"
requires-python = ">=3.14"
# The base install, the model package, the client library and the thin CLI, as ranges below each next major (D-084):
# each floor is the lowest release tried, and the base's tests passed on it; `make wheelcheck` installs the base alone
# at the floors.
dependencies = [
    "httpx>=0.27.0,<1",
    "jsonschema>=4.18.0,<5",
    "PyYAML>=6.0.3,<7",
    "referencing>=0.28.4,<1",
]

[project.scripts]
fylgja-core = "fylgja_core.cli:main"
fylgja-core-server = "fylgja_core.server.entry:main"

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pytest==9.2.0",
    "rfc8785==0.1.4",
    "ruff==0.17.3",
    "types-PyYAML==6.0.12.20260906",
]
# The extra `server`, what the server runs on: its own libraries and the base's four again, each at the exact pin
# every tier runs on (D-084). `make venv` and the image install it.
server = [
    "grpcio==1.84.0",
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "jsonschema==4.26.0",
    "lightkube==1.0.1",
    "lightkube-models==1.37.0.8",
    "msgspec==0.22.0",
    "protobuf==7.36.2",
    "pygnmi==0.8.15",
    "PyYAML==6.0.3",
    "referencing==0.37.0",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fylgja_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ on the path, so tests/live, tests/cluster and tests/conformance, each collected alone by its make target,
# import the store contract, the fakes and the host's readings.
pythonpath = ["tests"]
markers = [
    "live: boots images on the local containerlab driver: tests/live, and the conformance suite on the local harness; run with make live, or the suite alone with make conformance",
    "cluster: runs against the k3s cluster from the development host: tests/cluster, and the conformance suite on the cluster harness; run with make cluster, or the suite with make conformance DRIVER=clabernetes",
]
addopts = "-p no:cacheprovider -m 'not live and not cluster'"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests", "../scripts"]

[[tool.mypy.overrides]]
module = ["jsonschema.*", "rfc8785.*", "referencing.*", "pygnmi.*", "grpc.*"]
ignore_missing_imports = true
