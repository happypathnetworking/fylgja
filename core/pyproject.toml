[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "fylgja-core"
version = "0.0.0"
description = "Fylgja's core: a blueprint becomes a twin."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pytest==9.2.0",
    "rfc8785==0.1.4",
    "ruff==0.17.3",
    "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fylgja_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: boots images on the local containerlab driver; run with make live"]
addopts = "-p no:cacheprovider -m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests", "../scripts"]

[[tool.mypy.overrides]]
module = ["jsonschema.*", "rfc8785.*", "referencing.*"]
ignore_missing_imports = true
