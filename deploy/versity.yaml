# The store (D-061): Versity S3 Gateway over a local-path volume, the core's object store at http://versity:7070.
#
# Its `posix` backend makes the volume's directory an S3 endpoint and each directory under it a bucket, so an init
# container makes the bucket `fylgja` before the gateway starts (verified-facts.md); `args` reach the gateway through
# the image's entry point. Its root keys are the core's own two, from the Secret fylgja-s3. It serves plain HTTP, with
# SigV4 its only guard, on a pod network every twin's pods share, so its NetworkPolicy admits the core's pods alone, on
# 7070. One replica, bound to its volume's node: drained, the store and the core stop together, and the twins run on,
# unmanaged, until it returns (D-061).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: versity
  namespace: fylgja
  labels:
    app.kubernetes.io/name: versity
    app.kubernetes.io/part-of: fylgja
spec:
  serviceName: versity
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: versity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: versity
        app.kubernetes.io/part-of: fylgja
    spec:
      initContainers:
        - name: bucket
          image: ghcr.io/versity/versitygw:v1.10.0
          command: ["mkdir", "-p", "/data/fylgja"]
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
      containers:
        - name: versity
          image: ghcr.io/versity/versitygw:v1.10.0
          args: ["posix", "/data"]
          env:
            - name: ROOT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fylgja-s3
                  key: FYLGJA_S3_ACCESS_KEY
            - name: ROOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fylgja-s3
                  key: FYLGJA_S3_SECRET_KEY
          ports:
            - name: s3
              containerPort: 7070
          readinessProbe:
            tcpSocket:
              port: 7070
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: fylgja
      spec:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: versity
  namespace: fylgja
  labels:
    app.kubernetes.io/name: versity
    app.kubernetes.io/part-of: fylgja
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: versity
  ports:
    - name: s3
      port: 7070
      targetPort: 7070
---
# The gateway is shut to twins: one source, a pod selector alone, so this namespace's pods of the core's label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: versity
  namespace: fylgja
  labels:
    app.kubernetes.io/part-of: fylgja
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: versity
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fylgja-core
      ports:
        - protocol: TCP
          port: 7070
