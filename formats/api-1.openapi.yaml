openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: fylgja-core API
  version: "1"
  summary: The core's resource API, its only boundary.
  description: >-
    Every client (the thin CLI, the orchestrator, a UI, an agent) reaches the core through this API
    alone. A twin is a resource in Kubernetes's shape, without Kubernetes (D-025): a client PUTs its
    spec, the core's reconcile loop works toward it, and the client reads or watches its status.
    Every change of spec starts a run, linked from the status, read by id and by an event cursor, and
    cancelled by id. Verdicts are findings-1 documents; anything malformed or refused at the door is an RFC 9457
    problem-1 document. The API answers JSON only; clients render. Twins are independent: each has
    at most one run at a time.
  license:
    name: see repository
servers:
  - url: http://127.0.0.1:7650
    description: Local development; TLS terminates at the ingress in production.
security:
  - bearer: []
tags:
  - name: blueprints
  - name: bundles
  - name: packages
  - name: drivers
  - name: twins
  - name: runs
  - name: meta

paths:
  /v1/version:
    get:
      tags: [meta]
      operationId: getVersion
      summary: The API version, the build and the format versions this core speaks.
      security: []
      responses:
        "200":
          description: The server's versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }

  /v1/blueprints:
    post:
      tags: [blueprints]
      operationId: putBlueprint
      summary: File a blueprint; answers its id. Idempotent, since the id is the content's.
      description: An unsorted list is refused, never sorted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "blueprint-1.schema.json" }
      responses:
        "201":
          description: Filed for the first time.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Created" }
        "200":
          description: Already filed under this id; nothing written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Created" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/blueprints/{blueprint_id}:
    parameters:
      - $ref: "#/components/parameters/BlueprintId"
    get:
      tags: [blueprints]
      operationId: getBlueprint
      summary: Read a filed blueprint, its source envelope included.
      responses:
        "200":
          description: The blueprint as filed.
          content:
            application/json:
              schema: { $ref: "blueprint-1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/bundles:
    post:
      tags: [bundles]
      operationId: buildBundle
      summary: Compile a filed blueprint with the loaded packages; answers the bundle's id, manifest, fidelity and findings.
      description: Idempotent. An uncompilable blueprint is 422 with every fault in findings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [blueprint_id]
              properties:
                blueprint_id:
                  $ref: "bundle-1.schema.json#/$defs/id"
                  description: The filed blueprint to compile; the compiler reads it from the store.
      responses:
        "201":
          description: Built and filed.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompileResult" }
        "200":
          description: Already filed under this id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompileResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/bundles/{bundle_id}:
    parameters:
      - $ref: "#/components/parameters/BundleId"
    get:
      tags: [bundles]
      operationId: getBundle
      summary: Read a filed bundle's manifest.
      responses:
        "200":
          description: The manifest, with its id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, manifest]
                properties:
                  id:
                    $ref: "bundle-1.schema.json#/$defs/id"
                    description: The bundle's id; clients cite it.
                  manifest:
                    $ref: "bundle-1.schema.json"
                    description: The bundle's manifest; clients show it and diff it.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/bundles/{bundle_id}/diff/{to_bundle_id}:
    parameters:
      - $ref: "#/components/parameters/BundleId"
      - name: to_bundle_id
        in: path
        required: true
        description: The bundle stepped to.
        schema: { $ref: "bundle-1.schema.json#/$defs/id" }
    get:
      tags: [bundles]
      operationId: diffBundles
      summary: What a step from one bundle to another changes, runtime-independent; nothing is built.
      description: The lifecycle actions a step takes are the driver's, from comparing deployments (PUT /v1/twins/{name}?dry_run=true).
      responses:
        "200":
          description: The diff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BundleDiff" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/packages:validate:
    post:
      tags: [packages]
      operationId: validatePackage
      summary: Hold one platform or probe package to its schema and cross-field rules; nothing is loaded.
      description: A package that fails is a verdict (status rejected), not a problem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [package]
              properties:
                package:
                  description: The package, parsed from its YAML by the client; the validator reads it.
                  oneOf:
                    - $ref: "platform-package-1.schema.json"
                    - $ref: "probe-package-1.schema.json"
      responses:
        "200":
          description: The verdict, operation packages.validate, status ok or rejected.
          content:
            application/json:
              schema: { $ref: "findings-1.schema.json" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/drivers:
    get:
      tags: [drivers]
      operationId: listDrivers
      summary: The drivers this core serves, their capabilities and which is the default.
      responses:
        "200":
          description: Every driver.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [drivers]
                properties:
                  drivers:
                    type: array
                    items: { $ref: "#/components/schemas/Driver" }
                    description: Sorted by name; clients choose a driver and branch on capabilities.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/capacity:
    get:
      tags: [drivers]
      operationId: getCapacity
      summary: The running driver's reading of its runtime's room, so a client can look before it asks.
      description: >-
        The default driver's reading, taken now and outside admission: advisory, never a reservation, so a
        create the reading seemed to fit can still be refused at admission (D-076).
      responses:
        "200":
          description: The reading.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capacity" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/twins:
    get:
      tags: [twins]
      operationId: listTwins
      summary: Every twin's record, or a watch of every twin.
      parameters:
        - $ref: "#/components/parameters/Watch"
        - $ref: "#/components/parameters/SinceRevision"
      responses:
        "200":
          description: >-
            As JSON, the records sorted by name. As text/event-stream, a watch: every current record (those
            beyond since_revision, when given), then one WatchEvent per change to any twin, in the order the
            store wrote them.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [twins]
                properties:
                  twins:
                    type: array
                    items: { $ref: "twin-record-1.schema.json" }
                    description: Every twin record; the CLI's list and the orchestrator read it.
            text/event-stream:
              schema:
                type: string
                description: SSE messages, each event named ADDED, MODIFIED or DELETED and each data line one WatchEvent as JSON.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/twins/{name}:
    parameters:
      - $ref: "#/components/parameters/TwinName"
    get:
      tags: [twins]
      operationId: getTwin
      summary: One twin's record, or a watch of it.
      parameters:
        - $ref: "#/components/parameters/Watch"
        - $ref: "#/components/parameters/SinceRevision"
      responses:
        "200":
          description: >-
            As JSON, the record. As text/event-stream, a watch: the record as it stands (ADDED at revision
            1, else MODIFIED) unless since_revision is at or beyond it, then one WatchEvent per write to the
            record, the whole object each time, each revision once, ending with DELETED once the twin is
            gone. The store keeps no history, so a client that reconnects with the last revision it saw is
            sent the record as it stands and every later write: it misses no change of state and is sent
            none it saw. A twin that does not exist when the watch begins is 404.
          headers:
            ETag:
              description: The record's revision, quoted; a PUT or DELETE sends it back as If-Match.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "twin-record-1.schema.json" }
            text/event-stream:
              schema:
                type: string
                description: SSE messages, each event named ADDED, MODIFIED or DELETED and each data line one WatchEvent as JSON.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [twins]
      operationId: applyTwin
      summary: Create a twin, or step it, by writing its spec.
      description: >-
        Writes spec by compare-and-set and answers the record. A new spec increments generation and queues a
        run toward it, which the reconcile loop starts: a create when the twin is new, or exists but never
        applied a lab, otherwise a step (D-050), which re-cables live, restarts or recreates nodes as the
        driver's changes say, refusing a restart without allow_restart. A diverged twin accepts only deletion,
        so a new spec of one is refused 409 (twin.diverged); the loop refuses the rest of what a step must not
        do, ending its run rejected. Writing the spec the twin already has changes nothing, starts no run and
        answers 200. A new spec whose write loses to the loop's own write of the status, between the server's
        read and its write, is written once more over the record as it then stands, its refusals checked
        again; it fails 412 (twin.conflict) when a client moved the record, when it loses a second time, or
        when If-Match named a revision. With dry_run=true it writes nothing: it compiles the blueprint, runs
        admission and the driver's pure plan, and answers what would happen; on a twin that runs, admission
        keeps the allocation it holds and checks only the demand the target adds, and the Plan carries the
        changes, its verdict rejected where the step would be refused. A refused admission is the run's
        verdict, status rejected; a dry run answers it as a 422 problem whose rule is the refusal's, since a
        refusal reserves nothing to plan with.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: The revision the client read, quoted; the write fails 412 if the record has moved since.
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          description: "\"*\" to create only: the write fails 412 if the twin exists."
          schema: { type: string, enum: ["*"] }
        - name: dry_run
          in: query
          required: false
          description: >-
            Plan only; nothing is written and no run starts. A blueprint that does not compile, a bundle
            the driver cannot plan and a refused admission each answer 422 (Unprocessable); a step the loop
            would refuse answers its Plan, the verdict rejected.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwinApply" }
      responses:
        "201":
          description: Created; the record, generation 1, status not yet observed.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "twin-record-1.schema.json" }
        "200":
          description: >-
            The spec written (or already in place): the record. With dry_run=true, the Plan instead.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "twin-record-1.schema.json"
                  - $ref: "#/components/schemas/Plan"
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [twins]
      operationId: deleteTwin
      summary: Ask for a twin's deletion; cancels a run in flight first.
      description: >-
        Sets deletion_requested_at and increments generation; the loop tears the twin down and then deletes the
        record, which a watch reports as DELETED. The record stays readable until then. A restarted core
        resumes the teardown.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: The revision the client read, quoted; the request fails 412 if the record has moved since.
          schema: { type: string }
      responses:
        "202":
          description: >-
            Deletion requested; the record as written, deletion_requested_at set and generation
            incremented. The loop sets Ready False (twin.deleting) as it begins the teardown, since the
            API never writes status. Asked again, the record as it stands, with nothing written.
          content:
            application/json:
              schema: { $ref: "twin-record-1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  /v1/twins/{name}/verifications:
    parameters:
      - $ref: "#/components/parameters/TwinName"
    post:
      tags: [twins]
      operationId: verifyTwin
      summary: Read every node once and judge it against the bundle it should hold.
      description: Synchronous and bounded by the platforms' gNMI reads and the probes' bursts, run one after another; changes nothing. A step's wait runs verify inside the step's run.
      responses:
        "200":
          description: The verdict, operation verify, status ok, nonconforming, or failed when a node could not be read, with counts.
          content:
            application/json:
              schema: { $ref: "findings-1.schema.json" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: Runs, newest first.
      parameters:
        - name: twin
          in: query
          required: false
          description: Only this twin's runs.
          schema: { $ref: "twin-record-1.schema.json#/$defs/twin_name" }
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
                    description: Newest first; the CLI's run list and the orchestrator read it.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: getRun
      summary: One run, its verdict once it has ended.
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/runs/{run_id}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: getRunEvents
      summary: A run's events after a cursor, as JSON or as server-sent events; no replay beyond the store.
      parameters:
        - name: after
          in: query
          required: false
          description: Answer only events with seq greater than this; 0 or absent for all.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: >-
            The events so far. As text/event-stream, each event is one SSE message whose id is its seq and
            whose data is one Event; the stream ends when the run ends, and Last-Event-ID resumes it (the
            greater of it and after). An after or a Last-Event-ID that is no integer of 0 or more is 400.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
            text/event-stream:
              schema:
                type: string
                description: SSE messages, each data line one Event as JSON.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/runs/{run_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Ask a run to cancel; it stops where it is and ends.
      description: >-
        A create stops where it is, tears down what it built and ends failed with run.cancelled. A step stops
        where it is and tears nothing down: before its apply began it ends failed with run.cancelled, the twin
        running what it ran; from its apply on it ends diverged; one whose phases have all run ends as it
        would have. A restore stops where it is and tears nothing down, and ends failed with run.cancelled. A
        destroy run is never stopped halfway: it is marked cancelling and completes all the same.
      responses:
        "202":
          description: Cancellation requested; the run, state cancelling. Read it to see how it ends.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >-
        A per-client token, each mapped to a principal (from Secrets, or a local file of token hashes in
        development); several may be valid at once for rotation. A missing or unknown token is 401
        (auth.token.missing, auth.token.unknown); a known principal not allowed the call is 403
        (auth.forbidden). Every request's principal is written to the audit log and to the runs it starts.

  parameters:
    TwinName:
      name: name
      in: path
      required: true
      description: The twin's name.
      schema: { $ref: "twin-record-1.schema.json#/$defs/twin_name" }
    Watch:
      name: watch
      in: query
      required: false
      description: >-
        true streams changes as server-sent events instead of answering once; with no watch, an Accept of
        text/event-stream asks the same, and false answers JSON whatever the Accept.
      schema: { type: boolean, default: false }
    SinceRevision:
      name: since_revision
      in: query
      required: false
      description: Watch only changes after this revision; a reconnecting client sends the last it saw.
      schema: { type: integer, minimum: 0 }
    BlueprintId:
      name: blueprint_id
      in: path
      required: true
      description: A blueprint id.
      schema: { $ref: "bundle-1.schema.json#/$defs/id" }
    BundleId:
      name: bundle_id
      in: path
      required: true
      description: A bundle id.
      schema: { $ref: "bundle-1.schema.json#/$defs/id" }
    RunId:
      name: run_id
      in: path
      required: true
      description: A run id.
      schema: { $ref: "twin-record-1.schema.json#/$defs/run_id" }

  headers:
    Location:
      description: The created resource or the started run.
      schema: { type: string, format: uri-reference }

    ETag:
      description: The twin record's revision, quoted.
      schema: { type: string }
  responses:
    Invalid:
      description: Malformed (blueprint.unsorted, request.invalid, ...).
      content:
        application/problem+json:
          schema: { $ref: "problem-1.schema.json" }
    Unauthenticated:
      description: No token, or one no principal holds.
      content:
        application/problem+json:
          schema: { $ref: "problem-1.schema.json" }
    Forbidden:
      description: The principal may not make this call.
      content:
        application/problem+json:
          schema: { $ref: "problem-1.schema.json" }
    NotFound:
      description: No such blueprint, bundle, twin or run.
      content:
        application/problem+json:
          schema: { $ref: "problem-1.schema.json" }
    Conflict:
      description: The request contradicts the twin's state (twin.driver.fixed, twin.deleting, twin.diverged), the twin has no applied deployment to read (twin.not_running), or the run has already ended (run.ended).
      content:
        application/problem+json:
          schema: { $ref: "problem-1.schema.json" }
    PreconditionFailed:
      description: >-
        The record moved since the client read it, or If-Match names a twin that does not exist
        (twin.conflict); the twin exists under If-None-Match (twin.exists).
      content:
        application/problem+json:
          schema: { $ref: "problem-1.schema.json" }
    Unavailable:
      description: The running driver could not read its runtime (capacity.unread).
      content:
        application/problem+json:
          schema: { $ref: "problem-1.schema.json" }
    Unprocessable:
      description: >-
        Well-formed but not compilable (bundle.rejected) or not plannable on the driver (plan.rejected),
        every fault in findings; or, for a dry run, refused admission, under the refusal's rule
        (admission.capacity, say) with its finding.
      content:
        application/problem+json:
          schema: { $ref: "problem-1.schema.json" }

  schemas:
    Version:
      type: object
      additionalProperties: false
      required: [api, build, formats]
      properties:
        api:
          const: "1"
          description: The API's version; the client library refuses a server of another.
        build:
          type: string
          minLength: 1
          description: The core's build (version and commit); the CLI's --version and bug reports show it.
        formats:
          type: object
          additionalProperties: false
          required: [blueprint, bundle, deployment, twin_record, findings, problem, platform_package, probe_package]
          properties:
            blueprint: { const: "1", description: "The blueprint version the core reads; the orchestrator writes it." }
            bundle: { const: "1", description: "The bundle version the core writes; clients read manifests of it." }
            deployment: { const: "1", description: "The deployment version the plan answers; clients read it." }
            twin_record: { const: "1", description: "The record version GET /v1/twins answers; clients read it." }
            findings: { const: "1", description: "The verdict version; clients read it." }
            problem: { const: "1", description: "The problem version; clients read it." }
            platform_package: { const: "1", description: "The platform package version the loader and validator read." }
            probe_package: { const: "1", description: "The probe package version the loader and validator read." }
          description: Each format's current version; the client library checks them before it talks.

    Created:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          $ref: "bundle-1.schema.json#/$defs/id"
          description: The filed document's content address; clients pass it on.

    CompileResult:
      type: object
      additionalProperties: false
      required: [id, manifest, fidelity, findings]
      properties:
        id:
          $ref: "bundle-1.schema.json#/$defs/id"
          description: The bundle's id; clients pass it to PUT, plan or steps.
        manifest:
          $ref: "bundle-1.schema.json"
          description: The bundle's manifest; clients show it.
        fidelity:
          $ref: "deployment-1.schema.json#/$defs/compile_fidelity"
          description: The runtime-independent fidelity, computed and never filed; clients show it.
        findings:
          type: array
          items: { $ref: "findings-1.schema.json#/$defs/finding" }
          description: The compile's warnings and infos (errors are a 422); clients show them.

    TwinApply:
      type: object
      additionalProperties: false
      required: [spec]
      properties:
        spec:
          type: object
          additionalProperties: false
          properties:
            blueprint_id:
              $ref: "bundle-1.schema.json#/$defs/id"
              description: The blueprint to run, when the client names one; the loop compiles it to a bundle.
            bundle_id:
              $ref: "bundle-1.schema.json#/$defs/id"
              description: The bundle to run, when the client names one directly; the loop plans it with no compile.
            driver:
              $ref: "deployment-1.schema.json#/$defs/driver"
              description: >-
                The driver the twin runs on, fixed at creation; the server's configured driver when absent. A PUT
                naming another than the twin's is refused (twin.driver.fixed).
            allow_restart:
              type: boolean
              default: false
              description: Whether the loop may restart or recreate nodes to reach this spec; false when absent.
          oneOf:
            - required: [blueprint_id]
              not: { required: [bundle_id] }
            - required: [bundle_id]
              not: { required: [blueprint_id] }
          description: >-
            What the twin should be, as a partial spec: exactly one of the two ids, and driver and allow_restart
            when the client sets them. The server fills what is absent and writes the whole spec to the record,
            whose spec requires both. Unknown fields are refused.

    Plan:
      type: object
      additionalProperties: false
      required: [deployment, verdict]
      properties:
        deployment:
          $ref: "deployment-1.schema.json"
          description: What applying the spec would deploy, with its fidelity; clients show it.
        verdict:
          $ref: "findings-1.schema.json"
          description: >-
            The plan's findings (operation plan): ok, or, for a step, rejected with the findings the loop's
            refusal would carry (step.twin.diverged, step.relink.unsupported, step.restart.required, or
            bundle.rejected for a running deployment the driver cannot step from). A refused admission is a 422
            problem instead, since it leaves no deployment to answer. Clients exit by its status.
        changes:
          $ref: "#/components/schemas/Changes"
          description: >-
            For a twin that runs, what the step would do to each node and link, from the deployment the twin
            runs to this one; absent for a create, and for a running deployment the driver cannot step from.
            The CLI's twin step --dry-run and the orchestrator's report read it.

    Changes:
      type: object
      additionalProperties: false
      required: [nodes, links_added, links_removed]
      description: >-
        What the driver's changes call answers (D-049): the runtime's own lifecycle actions for a step from one
        deployment of a twin to another, every node of either by name and the links added and removed.
      properties:
        nodes:
          type: array
          description: Every node of either deployment, device or probe host, sorted by name; the step's phases and clients read it.
          items:
            type: object
            additionalProperties: false
            required: [node, action, reasons]
            properties:
              node:
                type: string
                minLength: 1
                description: The node's name in the deployments; clients show it.
              action:
                enum: [kept, added, removed, recabled, restarted, recreated, unsupported]
                description: >-
                  What the runtime does to the node: recabled changes its links and the node stays, restarted is
                  a link change under a restart link mode, recreated makes the node anew, and unsupported is a
                  change the runtime cannot make. restarted and recreated need allow_restart; unsupported refuses
                  the step. The step's refusals and clients read it.
              reasons:
                type: array
                uniqueItems: true
                items: { enum: [kind, image, link_mode, exec, links, hot_add] }
                description: >-
                  Why a node is not simply kept, sorted: a member of its node differs (kind, image, link_mode),
                  its start-up lines do (exec), its links do (links), or a port is added after boot to a kind
                  that cannot add one (hot_add); empty for kept, added and removed. The refusals' messages and
                  clients show them.
        links_added:
          type: array
          items:
            type: array
            prefixItems: [{ type: string, minLength: 1 }, { type: string, minLength: 1 }]
            items: false
            minItems: 2
          description: >-
            Links only in the target, each its two endpoints as node:port in the topology's runtime names, the
            pair sorted, the list sorted; the step's apply wires them, and clients show them.
        links_removed:
          type: array
          items:
            type: array
            prefixItems: [{ type: string, minLength: 1 }, { type: string, minLength: 1 }]
            items: false
            minItems: 2
          description: >-
            Links only in the running deployment, each as links_added gives one, the list sorted; the step's
            apply unwires them, and clients show them.

    WatchEvent:
      type: object
      additionalProperties: false
      required: [type, object]
      properties:
        type:
          enum: [ADDED, MODIFIED, DELETED]
          description: What happened to the record; the SSE event name repeats it.
        object:
          $ref: "twin-record-1.schema.json"
          description: The whole record after the change (its last state for DELETED); its revision is the watch's cursor.

    Capacity:
      type: object
      additionalProperties: false
      required: [driver, read_at, hosts, pending, twins]
      properties:
        driver:
          $ref: "deployment-1.schema.json#/$defs/driver"
          description: The default driver whose runtime was read; the orchestrator reads it to know which runtime answered, and `capacity show --json` carries it.
        read_at:
          type: string
          format: date-time
          description: >-
            When the server took the reading, in the core's clock form (RFC 3339 UTC with microseconds and a `Z`,
            as every other date-time the core writes); the orchestrator reads it to know how old the room is, and
            `capacity show --json` carries it.
        hosts:
          type: array
          description: The runtime's hosts in the driver's order; the orchestrator sums them before it asks and the CLI lists them.
          items:
            type: object
            additionalProperties: false
            required: [name, cpu, memory_mb]
            properties:
              name:
                type: string
                description: The host's name as the driver reports it; the CLI shows it.
              cpu:
                type: object
                additionalProperties: false
                required: [total, free]
                properties:
                  total: { type: number, description: The host's CPUs in all; the CLI shows it. }
                  free: { type: number, description: The host's CPUs free now; the orchestrator compares a demand with it. }
                description: The host's CPU room, in CPUs; the orchestrator and the CLI read it.
              memory_mb:
                type: object
                additionalProperties: false
                required: [total, free]
                properties:
                  total: { type: integer, description: The host's memory in all, in MiB; the CLI shows it. }
                  free: { type: integer, description: The host's memory free now, in MiB; the orchestrator compares a demand with it. }
                description: The host's memory room, in MiB; the orchestrator and the CLI read it.
        pending:
          type: object
          additionalProperties: false
          required: [nodes, cpu, memory_mb]
          properties:
            nodes: { type: integer, minimum: 0, description: The nodes admitted twins have yet to start; the CLI shows it. }
            cpu: { type: number, minimum: 0, description: The CPUs those nodes will take; the orchestrator subtracts it from the free room. }
            memory_mb: { type: integer, minimum: 0, description: The MiB those nodes will take; the orchestrator subtracts it from the free room. }
          description: What admitted twins have yet to take of the room, which admission subtracts; the orchestrator and the CLI read it.
        twins:
          type: integer
          minimum: 0
          description: The twin records holding an allocation, every one of which the reading was given (D-076).

    Driver:
      type: object
      additionalProperties: false
      required: [name, default, capabilities]
      properties:
        name:
          $ref: "deployment-1.schema.json#/$defs/driver"
          description: The driver's name; PUT /v1/twins/{name} takes it.
        default:
          type: boolean
          description: Whether a twin naming no driver runs on it; the CLI shows it.
        capabilities:
          type: object
          additionalProperties: false
          required: [nodes, relink, forwarding, access, isolation, reapply]
          properties:
            nodes:
              enum: [provisions, claims]
              description: Whether the driver creates nodes or claims existing ones; code above the seam branches on it.
            relink:
              type: boolean
              description: Whether links can change on a running twin; the step comparison branches on it.
            forwarding:
              enum: [software, hardware]
              description: How nodes forward on this runtime; each deployment's fidelity copies it.
            access:
              enum: [direct, proxied]
              description: Whether node addresses are reachable directly or through a twin record node's access host; clients branch on it.
            isolation:
              enum: [names, network]
              description: Whether twins are kept apart by name alone (local labs whose management networks route to each other through the host) or by the network (a NetworkPolicy per namespace); clients show it (D-019).
            reapply:
              type: boolean
              description: Whether applying a deployment again finishes an apply that was cut short; where it is false, a resumed apply probes the lab first and may reconfigure it (D-068). Clients show it.

    BundleDiff:
      type: object
      additionalProperties: false
      required: [from, to, unchanged, nodes, links, probes]
      properties:
        from:
          $ref: "bundle-1.schema.json#/$defs/id"
          description: The bundle stepped from; clients cite it.
        to:
          $ref: "bundle-1.schema.json#/$defs/id"
          description: The bundle stepped to; clients cite it.
        unchanged:
          type: boolean
          description: Every list below empty; the orchestrator skips a step on it.
        nodes:
          type: object
          additionalProperties: false
          required: [added, removed, changed]
          properties:
            added:
              type: array
              items: { type: string }
              description: Nodes only in to, sorted by name; the step's plan creates them.
            removed:
              type: array
              items: { type: string }
              description: Nodes only in from, sorted by name; the step's plan removes them.
            changed:
              type: array
              description: Nodes in both that differ; the step pushes or recreates them.
              items:
                type: object
                additionalProperties: false
                required: [node, reasons]
                properties:
                  node:
                    type: string
                    description: The node's name; clients show it.
                  reasons:
                    type: array
                    minItems: 1
                    items: { enum: [platform, mapping, config] }
                    description: In the order platform, mapping, config; platform recreates, mapping may re-cable, config re-pushes. The step's plan and the report read them.
          description: Node changes; the step and the report read them.
        links:
          type: object
          additionalProperties: false
          required: [added, removed]
          properties:
            added:
              type: array
              items: { $ref: "blueprint-1.schema.json#/$defs/link" }
              description: Links only in to, sorted as blueprint 1 sorts links; the step's plan wires them.
            removed:
              type: array
              items: { $ref: "blueprint-1.schema.json#/$defs/link" }
              description: Links only in from, sorted as blueprint 1 sorts links; the step's plan unwires them.
          description: Link changes; the step and the report read them.
        probes:
          type: object
          additionalProperties: false
          required: [added, removed]
          properties:
            added:
              type: array
              items: { type: string }
              description: Probes only in to, sorted by name; their flows start after the step.
            removed:
              type: array
              items: { type: string }
              description: Probes only in from, sorted by name; reported as dropped in the step's loss.
          description: Probe changes; flows and the report read them.

    Run:
      type: object
      additionalProperties: false
      required: [id, twin, operation, state, principal, created_at]
      properties:
        id:
          $ref: "twin-record-1.schema.json#/$defs/run_id"
          description: The run's id; every runs path takes it.
        twin:
          $ref: "twin-record-1.schema.json#/$defs/twin_name"
          description: The twin the run acts on; clients link to it.
        operation:
          enum: [create, step, restore, destroy]
          description: >-
            What the run does; clients render by it. A restore is the loop's own (principal core): a node of a
            settled twin found at another incarnation is readied, pushed and verified again.
        state:
          enum: [queued, running, cancelling, ended]
          description: Where the run is; ended means verdict is present. Clients poll until ended.
        principal:
          type: string
          minLength: 1
          description: Who asked for it (Constitution X); the audit log and show name it.
        created_at:
          type: string
          format: date-time
          description: When the request was accepted; clients sort and show it.
        ended_at:
          type: string
          format: date-time
          description: When the run ended; present once ended. Clients show it.
        verdict:
          $ref: "findings-1.schema.json"
          description: >-
            The run's verdict (status, findings, a step's or a restore's counts and wait, a step's loss); present once
            ended.

    Event:
      type: object
      additionalProperties: false
      required: [seq, at, phase, outcome]
      properties:
        seq:
          type: integer
          minimum: 1
          description: The event's position in its run, from 1 with no gaps; the after cursor and SSE ids use it.
        at:
          type: string
          format: date-time
          description: When it happened; clients show elapsed time from it (timings are events now).
        phase:
          enum: [compile, admit, plan, apply, ready, push, verify, flows, destroy, cancel]
          description: The phase the event belongs to; clients show progress by it.
        outcome:
          enum: [started, done, failed, timed_out, cancelled, skipped]
          description: The phase's (or a node's) transition; clients show it.
        node:
          type: string
          description: The node it concerns, when per node (a node's readiness or push); clients show it.
        duration_s:
          type: number
          minimum: 0
          description: Seconds since the matching started event, on an end; metrics and clients read it.
        rule:
          $ref: "findings-1.schema.json#/$defs/rule"
          description: >-
            The rule of an ending other than plain success: on failed and timed_out, the failing finding's
            rule, which is the Ready condition's reason too (a compile or plan refusal carries bundle.rejected
            or plan.rejected, the verdict holding every finding); on the cancel phase's done, run.cancelled. A
            transient failure's failed event carries the error's rule when it has one and no finding is
            filed: the phase's next started is the retry. Clients show it; the verdict holds the findings.

    EventPage:
      type: object
      additionalProperties: false
      required: [events, next, ended]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
          description: Events with seq greater than after, in order; clients print them.
        next:
          type: integer
          minimum: 0
          description: The cursor to pass as after next time (the last seq here, or after when none); clients loop on it.
        ended:
          type: boolean
          description: Whether the run has ended and no event will follow; clients stop polling on it.
