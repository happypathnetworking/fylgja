# The development Infrahub's override of Infrahub's published Compose file, which scripts/infrahub_dev.py fetches
# into local/infrahub/ and never changes (make infrahub-up).
#
# The task workers get two read-only mounts. The first is the main checkout's .git directory alone, where every
# worktree's branch is a ref: the checkout itself holds local/.env, and a worker runs a repository's own code, so it
# is never mounted. The second is local/infrahub/repos/, for a bare mirror and throwaway repositories, and nothing
# else of local/. infrahub_dev.py sets both sources in Compose's environment; a Compose command without them fails.
#
# Neo4j is capped as it was for the reading of 1.11.11 that held 5.5 GiB (design/verified-facts.md).
#
# The database's health check keeps the published probe, interval and retries, and waits 180 s before a failed probe
# counts: the published 3 s start period called it unhealthy 43.9 s into a start on kept volumes, and Compose then
# refused to start what depends on it. Neo4j's `Started.` came 51.6 s and 53.8 s into its slowest starts read on kept
# volumes, 26.1 s into its quickest (design/verified-facts.md, "Infrahub 1.11.11"); 180 s, about 3.3 times the slowest,
# is there to tell a database still starting from one that will not.
#
# Every port the published file publishes is bound to loopback here: it names none with an address, so each would
# listen on every interface of the host, the server's among them, which answers a read with no token. The tag
# !override replaces the published list; an untagged list is added to it, and the first binding stays
# (design/verified-facts.md, "Docker Compose v5.6.0"). These are the three services 1.11.11's file publishes a port
# for: read the file's `ports` again when INFRAHUB_VERSION moves.
#
# The image is not pinned here: the published file reads ${VERSION}, which infrahub_dev.py sets from the make
# variable INFRAHUB_VERSION over whatever the shell or local/.env holds.
services:
  infrahub-server:
    ports: !override
      - "127.0.0.1:8000:8000"
  message-queue:
    ports: !override
      - "127.0.0.1:15692:15692"
  task-worker:
    volumes:
      - "${FYLGJA_INFRAHUB_REPO:?}:/srv/fylgja:ro"
      - "${FYLGJA_INFRAHUB_REPOS:?}:/srv/fylgja-repos:ro"
  database:
    ports: !override
      - "127.0.0.1:2004:2004"
      - "127.0.0.1:6362:6362"
    environment:
      NEO4J_server_memory_heap_initial__size: 1g
      NEO4J_server_memory_heap_max__size: 2g
      NEO4J_server_memory_pagecache_size: 1g
    healthcheck:
      start_period: 180s
