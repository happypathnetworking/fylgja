# The development Infrahub's override of Infrahub's published Compose file, which scripts/infrahub_dev.py fetches
# into local/infrahub/ and never changes (make infrahub-up).
#
# The task workers get two read-only mounts. The first is the main checkout's .git directory alone, where every
# worktree's branch is a ref: the checkout itself holds local/.env, and a worker runs a repository's own code, so it
# is never mounted. The second is local/infrahub/repos/, for a bare mirror and throwaway repositories, and nothing
# else of local/. infrahub_dev.py sets both sources in Compose's environment; a Compose command without them fails.
#
# The task workers are where Infrahub runs this repository's checks, which start the example's flows on the edge's
# Prefect (D-085). They are given its address, the host's name with no scheme, and its basic auth as user:password,
# which make orchestrator-env writes into local/.env and Compose reads from it; nothing else of Fylgja's, no token of
# the core's or of Infrahub's. The host's name answers the Docker bridge's gateway, where make prefect-up serves it.
#
# Neo4j is capped as it was for the reading of 1.11.11 that held 5.5 GiB (design/verified-facts.md).
#
# The image is not pinned here: the published file reads ${VERSION}, which infrahub_dev.py sets from the make
# variable INFRAHUB_VERSION over whatever the shell or local/.env holds.
services:
  task-worker:
    volumes:
      - "${FYLGJA_INFRAHUB_REPO:?}:/srv/fylgja:ro"
      - "${FYLGJA_INFRAHUB_REPOS:?}:/srv/fylgja-repos:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FYLGJA_ORCHESTRATOR_ADDRESS: host.docker.internal:4200
      FYLGJA_ORCHESTRATOR_AUTH: ${FYLGJA_ORCHESTRATOR_AUTH:-}
  database:
    environment:
      NEO4J_server_memory_heap_initial__size: 1g
      NEO4J_server_memory_heap_max__size: 2g
      NEO4J_server_memory_pagecache_size: 1g
