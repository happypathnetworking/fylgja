---
# The seeded branch's second stage, read by infrahubctl object load (infrahub/seed/seed.py): one address, in the
# documentation range, on n1's ethernet-1/2, the port the first stage cabled. The port is named by its name and its
# device, and sets nothing of its own, so the load finds the port main's devices' file made and makes the address
# under it; no port and no cable changes, and only n1's configuration does.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: InterfacePhysical
  data:
    - name: ethernet-1/2
      device: n1
      ip_addresses:
        kind: IpamIPAddress
        data:
          - address: 192.0.2.1/24
