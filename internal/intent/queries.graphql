# The queries genqlient generates typed Go from. The read selects the schema library's
# kinds as the mapping names them (D-057, Constitution III: specs/017-dcim-reader/
# contracts/mapping.md §2), and nothing beyond them; the stamps still select the generics
# until 017's T047 moves them to the read's shapes. A tier-1 test asserts that every
# operation is a query and names only the mapping's roots or Fylgja's, but for the four
# roots that are Infrahub's own units rather than the operator's model (014:
# CoreProposedChange, CoreArtifactValidator, Branch, and InfrahubEvent, its record of a
# write, D-048), each named there.
#
# Verified 2026-09-08 against Infrahub 1.11.2: envelope (`value`, `node`, `edges`),
# `limit`/`offset`, and generic resolution to concrete kinds. The queries take their order
# from the schema's `order_by` and pass no `order` argument; the event log is read newest
# first (`order: DESC`, IntentEvents below). `at` is a URL query parameter on POST
# /graphql/{branch} (URL-encode `+`): sent on every query of a read iff the operator
# supplied it, never otherwise. Re-verified 2026-09-14: Infrahub honours `at` to the
# microsecond and truncates beyond; an `at` before the default branch's creation is a
# 422; an unknown branch is a 404. The read's two shapes were verified on a branch holding
# the library on 2026-10-25 (017 research §1.6).
#
# Conformance (the mapping's table, the schema hash) is not a GraphQL query: it is GET
# /api/schema?branch=.

# M5 — the rendered configuration Infrahub holds for a device. The fragment names
# Infrahub's own target interface, never a concrete kind (Constitution III), and it is
# named rather than inline so genqlient derives a Go interface from it: a device node
# carries artifacts through this fragment's type, so nothing in Fylgja has to assert on
# a concrete device kind to read them.
#
# Spreading an interface fragment into a kind's selection is valid only where the two can
# overlap: the library's DcimDevice inherits CoreArtifactTarget, which conformance holds
# it to (its artifacts relationship, mapping.md §3) before the query runs.
fragment ArtifactFields on CoreArtifactTarget {
  artifacts {
    edges { node {
      name        { value }
      status      { value }
      content_type { value }
      checksum    { value }
      storage_id  { value }
      definition  { node { artifact_name { value } } }
    } }
  }
}

# 017 — the read, as the mapping gives it (specs/017-dcim-reader/contracts/mapping.md §2):
# the devices carrying the scope's tag, whatever their status, then the physical ports of
# those devices by their ids, each with the cable it is an end of. Two roots, because a
# device's interfaces edge cannot be narrowed to a kind, so reading ports from the device
# would read every virtual interface's name, which the mapping never reads; and the
# physical root takes no filter by its device's tags, so the ids come from the first query
# (research R-01). The tag itself is read by the filter alone. Both are paged by 100, every
# page at the read's `at` when one was given.
query Devices($tag: String!, $limit: Int!, $offset: Int!) {
  DcimDevice(tags__name__value: $tag, limit: $limit, offset: $offset) {
    count
    edges {
      node {
        id
        name { value }
        # The pair that picks the device's package (Constitution II): the platform's name
        # and its manufacturer's, compared exactly with each package's matches. Each node is
        # a pointer, so a device with no platform, or a platform with no manufacturer, is
        # told from one whose names are empty.
        platform {
          # @genqlient(pointer: true)
          node {
            name { value }
            manufacturer {
              # @genqlient(pointer: true)
              node {
                name { value }
              }
            }
          }
        }
        # Configuration: the artifacts Infrahub rendered for this device, listed in the
        # same request and at the same `at` as the intent.
        ...ArtifactFields
      }
    }
  }
}

# A cable is reached through the port's connector, the generic DcimConnector, never from
# a root of its own: an end that is not a physical port has no name and no device here,
# which is exactly "an end not on a physical port", and an end's device outside the scope
# is told by its id's absence from the devices read, with no query of it (R-05). An
# uncabled port's connector node is null.
#
# The connector's node is decoded into cable.go's connectorNode, not a generated type:
# genqlient's decoder refuses a __typename the SDL it was generated from does not name, so
# an end on an endpoint kind of the operator's own, or a connector that is not a
# DcimCable, would fail the whole read where the mapping omits the cable. The selection
# is still checked against the SDL when the client is generated.
query Ports($devices: [ID], $limit: Int!, $offset: Int!) {
  InterfacePhysical(device__ids: $devices, limit: $limit, offset: $offset) {
    count
    edges {
      node {
        id
        name   { value }
        role   { value }
        status { value }
        device { node { id } }
        connector {
          # @genqlient(bind: "github.com/happypathnetworking/fylgja/internal/intent.connectorNode")
          node {
            __typename
            id
            ... on DcimCable { label { value } }
            connected_endpoints {
              count
              edges { node {
                __typename
                id
                ... on InterfacePhysical {
                  name   { value }
                  device { node { id } }
                }
              } }
            }
          }
        }
      }
    }
  }
}

# 014 — the open proposed changes with their stages, read from the default branch, where
# the stage kind lives (D-045). CoreProposedChange is Infrahub's own unit, not the
# operator's model: one of the read-only test's four named exceptions. Only `open` is
# visible to Fylgja, draft or not. An empty $branch is omitted, which Infrahub 1.11.2
# reads as no filter at all, so every open proposed change is listed; "" would match
# none (verified 2026-10-16).
query ProposedChanges(
  # @genqlient(omitempty: true)
  $branch: String,
  $limit: Int!,
  $offset: Int!
) {
  CoreProposedChange(state__value: "open", source_branch__value: $branch, limit: $limit, offset: $offset) {
    count
    edges { node {
      id
      name               { value }
      source_branch      { value }
      destination_branch { value }
      state              { value }
      is_draft           { value }
      fylgja_stages { edges { node {
        id
        label       { value updated_at }
        as_of       { value updated_at }
        description { value }
      } } }
    } }
  }
}

# 014 — stages their proposed change no longer names, removed from its fylgja_stages
# (stage.orphaned; D-047).
query OrphanStages($limit: Int!, $offset: Int!) {
  FylgjaStage(proposed_change__isnull: true, limit: $limit, offset: $offset) {
    count
    edges { node {
      id
      label { value updated_at }
      as_of { value updated_at }
    } }
  }
}

# 014 — a branch's point of origin and its creation: the branch point's `at`, and the
# rebase rule. Branch is Infrahub's own, a named exception. A name that does not exist
# answers [] (verified 2026-10-16). Named BranchPoint, not BranchInfo, because genqlient
# names its function after the operation and intent.BranchInfo is the reader's type.
query BranchPoint($name: String!) {
  Branch(name: $name) {
    name
    branched_from
    created_at
  }
}

# 014 — a proposed change's artifact validators, read on the default branch pinned at a
# stage's `at`: the latest completed_at is half of a device's generation stamp (D-046).
# The value, never its updated_at: pinned, the value is the one in force and the
# metadata the current one (research §6.5). CoreArtifactValidator is Infrahub's own, a
# named exception. One validator per artifact definition, so one page.
query ArtifactValidations($id: ID!) {
  CoreArtifactValidator(proposed_change__ids: [$id]) {
    edges { node {
      completed_at { value }
      definition   { node { name { value } } }
    } }
  }
}

# 014 — when each part of a branch's intent, and each artifact's checksum, was last
# written: the head's `at` (one microsecond after the later of the latest stamp and the
# branch's latest intent event, D-048) and the staleness rule's two sides, per device
# (research R-06, R-07; D-046). Stamps only, never a value of
# intent but the names that key them, the platform that picks the device's package
# (Constitution II), and the device's and its interfaces' ids, by which an intent event
# names the device (D-048). An unset relationship's properties.updated_at is null and skipped.
# The artifacts are spread on CoreArtifactTarget, as the read's are: selected directly
# on FylgjaDevice they are refused. Named IntentStamps, not Stamps, because
# intent.Stamps is the aggregate's type.
fragment ArtifactStamps on CoreArtifactTarget {
  artifacts { edges { node {
    name     { value }
    checksum { value updated_at }
  } } }
}

# The platform's values, which pick the device's package, and the stamps of those that reach
# the artifact or the bundle: the template renders vendor, nos and version into every
# device's artifact and branches on nos, and nos picks the package (R-07). model reaches
# neither and is not stamped. A fragment of its own, as the read's platform fields were
# before 017: genqlient cannot merge two fragments' selections of one field.
fragment PlatformStamps on FylgjaPlatform {
  vendor  { value updated_at }
  nos     { value updated_at }
  version { value updated_at }
  model   { value }
}

query IntentStamps($limit: Int!, $offset: Int!) {
  FylgjaDevice(limit: $limit, offset: $offset) {
    count
    edges { node {
      id
      name { value updated_at }
      role { updated_at }
      site { updated_at }
      platform { properties { updated_at } node { ...PlatformStamps } }
      interfaces { edges {
        properties { updated_at }
        node {
          id
          name      { value updated_at }
          iftype    { updated_at }
          mgmt_only { updated_at }
          enabled   { updated_at }
          link      { properties { updated_at } }
          parent    { properties { updated_at } }
        }
      } }
      ...ArtifactStamps
    } }
  }
  FylgjaLink(limit: $limit, offset: $offset) {
    count
    edges { node {
      endpoints { edges {
        properties { updated_at }
        node { device { node { name { value } } } }
      } }
    } }
  }
}

# 014 — the source branch's events since its branched_from, newest first: when intent last
# changed, removals included, which no stamp records (D-048). InfrahubEvent is Infrahub's
# own record of a write, a named exception, read on the default branch's endpoint (it
# answers alike on a branch's) and pinned to nothing. A primary node's kind is the
# concrete one, read only to be mapped to a Fylgja generic through the branch schema's
# used_by, and never queried. The names of the attributes and relationships an update
# changed tell intent from Infrahub's own churn on the same node (a query group's
# membership, an artifact): only the fields the stamps fold into a device's intent count
# (R-07). A limit above 50 is refused (research §8.18).
query IntentEvents($branch: String!, $since: DateTime!, $limit: Int!, $offset: Int!) {
  InfrahubEvent(branches: [$branch], since: $since, order: DESC, limit: $limit, offset: $offset) {
    count
    edges { node {
      event
      occurred_at
      primary_node { id kind }
      ... on NodeMutatedEvent {
        attributes    { name }
        relationships { name peer { id } }
      }
    } }
  }
}
