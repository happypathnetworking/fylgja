[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "fylgja-orchestrator"
# The version is VERSION's at the root, which setup.py reads (D-106).
dynamic = ["version"]
description = "Fylgja's example orchestrator: a change rehearsed on a twin through the core's API."
license = "Apache-2.0"
# Never published: PyPI refuses an upload of a distribution with this classifier (D-106).
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.14"
# The core's base install, the model package and the client library, with no range of its own: the core states its
# libraries' ranges (D-084). The two readers, which the Infrahub change source (D-082) and the NetBox change source
# (D-095, D-097) each read through, and httpx, each source's own transport, at the core's range (D-083). Prefect,
# pinned as read, for the edge's two flows alone (D-085).
# The private branch's alone, for the OSPF check: Nornir's asyncio runner and nornir_scrapli's async tasks, both
# alphas, pinned exactly.
dependencies = [
    "fylgja-core", "fylgja-infrahub", "fylgja-netbox", "httpx>=0.27.0,<1", "prefect==3.9.2",
    "nornir==3.7.0a1", "nornir-scrapli[asyncio]==1.6.0a1",
]

[project.scripts]
fylgja-orchestrator = "fylgja_orchestrator.edge.cli:main"

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

# uv rebuilds this editable install's metadata when a key changes: its own defaults, and the root's VERSION, which
# setup.py reads and which lies outside the member (D-106; verified-facts.md, "A version read from a file").
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "setup.cfg" }, { file = "../VERSION" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fylgja_orchestrator = ["py.typed", "infrahub/queries/*.gql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ on the path, and the core's beside it, so the example's tests import the core's fakes and its boundary's lists.
pythonpath = ["tests", "../core/tests"]
markers = [
    "contract: runs against the development Infrahub; make contract",
    "contract_netbox: runs against the development NetBox; make contract-netbox",
]
addopts = "-p no:cacheprovider -m 'not contract and not contract_netbox'"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests", "../infrahub/checks/fylgja_glue.py"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/../core/tests"

[[tool.mypy.overrides]]
module = ["jsonschema.*", "rfc8785.*", "referencing.*", "pygnmi.*", "grpc.*"]
ignore_missing_imports = true
