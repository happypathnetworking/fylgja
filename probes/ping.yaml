# ping: the one shipped probe format (D-008). Two Alpine hosts, each cabled to an
# uncabled port of the intent, ping each other through the twin. Probe package 1
# (formats/probe-package-1.schema.json); the format value keys the mechanism (D-014).
probe_package_version: "1"
format: ping

host:
  interface: eth1                     # the host's one data port; eth0 is containerlab's management
  # Run once the container starts: the host's address on its port, then a host route to
  # the far host through the device. A host route, since a default route would collide
  # with containerlab's management default, and a prefix route with the connected
  # prefix when both endpoints share one.
  address: ["ip", "addr", "add", "{address}", "dev", "{interface}"]
  route: ["ip", "route", "add", "{far_address}/32", "via", "{gateway}", "dev", "{interface}"]

readiness:
  # Run inside the host, with no login.
  command: ["ip", "-4", "-o", "addr", "show", "dev", "{interface}"]
  expect: "{address}"                 # ready once the start-up command's address is on the port
  timeout_s: 30

flow:
  # Started after a step's stage, read after its wait: an interrupt ends ping and prints
  # its counters. BusyBox ping accepts -i 0.2 as root with no minimum-interval refusal.
  interval_s: 0.2
  command: ["ping", "-i", "{interval}", "{far_address}"]
  start_timeout_s: 30
  read_timeout_s: 30

burst:
  # Verify's burst: count echoes, held when every one is answered. -W is the seconds to
  # wait after the last echo; a burst costs about count x interval + wait_s, 3 s.
  count: 5
  wait_s: 2
  command: ["ping", "-c", "{count}", "-i", "{interval}", "-W", "{wait}", "{far_address}"]

fidelity:
  approximations:
    - "The hosts forward in their container's kernel and the twin's devices in theirs: a loss figure is the container's, never a hardware forwarder's."
    - "Timing is the container's: the interval, a reply's time and a gap are measured on the lab host's scheduler, under its load."
    - "A host speaks no discovery protocol, so the device port's neighbour is never asserted on a synthesized link."
    - "IPv4 only: ping and ip are run without -6."

runtime:
  containerlab:
    image:
      ref: alpine:3.24.2              # BusyBox 1.37.0's ping and ip; about 8 MB. Public: no pull secret
    resources:
      cpu: 0.1
      memory_mb: 32                   # a shell and one ping; measured live
    deploy_timeout_s: 60
    destroy_timeout_s: 30
