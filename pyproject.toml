# The uv workspace over the five distributions, and no distribution itself (D-108): uv's tables alone. Each member's
# pyproject.toml stays the statement of its pins; uv.lock is derived from them (`uv lock`) and `make venv` refuses it
# where it disagrees. infrahub/, netbox/ and nautobot/ hold pytest's settings alone and are no members.
[tool.uv]
required-version = "==0.12.23"
python-downloads = "never"
python-preference = "only-system"

[tool.uv.workspace]
members = ["core", "readers/infrahub", "readers/netbox", "readers/nautobot", "orchestrator"]

[tool.uv.sources]
fylgja-core = { workspace = true }
fylgja-infrahub = { workspace = true }
fylgja-netbox = { workspace = true }
fylgja-nautobot = { workspace = true }
