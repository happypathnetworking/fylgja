[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "fylgja-infrahub"
# The version is VERSION's at the root, which setup.py reads (D-106).
dynamic = ["version"]
description = "Fylgja's Infrahub reader: a branch of Infrahub read into a blueprint, or the findings that refused it."
license = "Apache-2.0"
requires-python = ">=3.14"
# The core's base install, the model package and the client library, at the reader's own version or later within the
# major, so a candidate's reader takes the candidate's core and a later reader never an earlier core (D-106); the
# floor is VERSION's, which a test holds. The core states its libraries' ranges (D-084). httpx is the transport's, at
# the core's range (D-083).
dependencies = ["fylgja-core>=1.0.0rc1,<2", "httpx>=0.27.0,<1"]

[project.scripts]
fylgja-infrahub = "fylgja_infrahub.cli:main"

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "types-PyYAML==6.0.12.20260906",
]

# uv rebuilds this editable install's metadata when a key changes: its own defaults, and the root's VERSION, which
# setup.py reads and which lies outside the member (D-106; verified-facts.md, "A version read from a file").
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "setup.cfg" }, { file = "../../VERSION" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fylgja_infrahub = ["py.typed", "queries/*.graphql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ on the path, so the tests import the fake source.
pythonpath = ["tests"]
markers = [
    "contract: runs against the development Infrahub; make contract",
]
addopts = "-p no:cacheprovider -m 'not contract'"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
