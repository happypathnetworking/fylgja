[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "fylgja-infrahub"
version = "0.0.0"
description = "Fylgja's Infrahub reader: a branch of Infrahub read into a blueprint, or the findings that refused it."
license = "Apache-2.0"
requires-python = ">=3.14"
# The core's base install, the model package and the client library, with no range of its own: the core states its
# libraries' ranges (D-084). httpx is the transport's, at the core's range (D-083).
dependencies = ["fylgja-core", "httpx>=0.27.0,<1"]

[project.scripts]
fylgja-infrahub = "fylgja_infrahub.cli:main"

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fylgja_infrahub = ["py.typed", "queries/*.graphql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ on the path, so the tests import the fake source.
pythonpath = ["tests"]
markers = [
    "contract: runs against the development Infrahub; make contract",
]
addopts = "-p no:cacheprovider -m 'not contract'"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
