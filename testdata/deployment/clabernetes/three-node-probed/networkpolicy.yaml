apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fylgja-isolation
  namespace: fylgja-twin-three-node-probed
  labels:
    fylgja.owner: core
    fylgja.twin: three-node-probed
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: c9s
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 198.51.100.0/24
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: fylgja
